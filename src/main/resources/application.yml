spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: sia
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${java.io.tmpdir}

  mail:
    host: ${SMTP_HOST:pro.turbo-smtp.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 2026

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  super-admin:
    correo: ${SUPER_ADMIN_EMAIL}
    contrasena: ${SUPER_ADMIN_PASSWORD}
    nombres: ${SUPER_ADMIN_NOMBRES:Super}
    apellidos: ${SUPER_ADMIN_APELLIDOS:Admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://d32gr4vkubb6g5.cloudfront.net}
  aws:
    s3:
      bucket: ${S3_BUCKET:sia-archivos}
      region: ${AWS_REGION:us-east-1}
      presigned-url-expiration-minutes: ${S3_PRESIGNED_URL_EXPIRATION_MINUTES:60}
  security:
    account-recovery:
      expiration-minutes: ${ACCOUNT_RECOVERY_EXPIRATION_MINUTES:15}
      max-attempts: ${ACCOUNT_RECOVERY_MAX_ATTEMPTS:5}
      expose-debug-data: ${ACCOUNT_RECOVERY_EXPOSE_DEBUG_DATA:false}
    audit:
      hash-secret: ${AUDIT_HASH_SECRET:local-audit-secret-change-me}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8001}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:gestion-academica-firebase.json}
  mail:
    transport: ${MAIL_TRANSPORT:SMTP}
    from: ${SMTP_FROM:no-reply@example.com}
    from-name: ${MAIL_FROM_NAME:SIA}
    mailtrap:
      api-url: ${MAILTRAP_API_URL:https://send.api.mailtrap.io/api/send}
      token: ${MAILTRAP_API_TOKEN:}
  vpay:
    base-url: ${VPAY_BASE_URL:https://vpay.com.bo:7778/pro}
    token: ${VPAY_TOKEN:}
    user: ${VPAY_USER:}
    company: ${VPAY_COMPANY:1}
    bank: ${VPAY_BANK:BMSC}
    destination-account: ${VPAY_DESTINATION_ACCOUNT:}
    verify-ssl: ${VPAY_VERIFY_SSL:true}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
